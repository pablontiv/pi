name: Nix

# The flake builds with the tracked model catalog snapshot and verifies its
# revision against nix/model-catalog.json. Release tags are built exactly as
# tagged. Once all systems build, the stable branch is fast-forwarded to the tag so that
# `nix run github:earendil-works/pi/stable` runs the latest release.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/**'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/coding-agent/install-lock/**'
      - 'packages/ai/scripts/hydrate-model-catalog.ts'
      - 'scripts/update-model-catalog-pin.mjs'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-${{ (github.event_name == 'pull_request' || github.ref_type == 'tag') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin:
    if: ${{ github.repository == 'earendil-works/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Verify the tracked model catalog
        run: |
          set -euo pipefail
          node scripts/update-model-catalog-pin.mjs nix/model-catalog.snapshot.json
          git diff --exit-code -- nix/model-catalog.json nix/model-catalog.snapshot.json

  build:
    needs: pin
    timeout-minutes: 45
    if: ${{ github.repository == 'earendil-works/pi' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Evaluate all systems
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: nix flake check --all-systems --no-build

      - name: Build
        run: nix build -L .

      - name: Smoke-test
        run: |
          ./result/bin/pi --version
          ./result/bin/pi --help > /dev/null
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "$(./result/bin/pi --version)" = "${GITHUB_REF_NAME#v}"
          fi

  update-stable:
    needs: build
    if: ${{ github.repository == 'earendil-works/pi' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Full history, so git can verify that the push to stable is a fast-forward.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without --force, the push fails unless it is a fast-forward, so stable
      # never moves back to an older release.
      - name: Fast-forward stable to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}:refs/heads/stable"
