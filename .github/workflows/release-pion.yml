name: Release Pion

on:
  push:
    tags:
      - "pion-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Pion tag to recover (for example, pion-v1.0.4-pion.1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-pion-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'pablontiv/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^pion-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-pion\.([1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid Pion release tag: ${RELEASE_TAG}"
            exit 1
          fi
          pion_version="${RELEASE_TAG#pion-v}"
          upstream_version="${BASH_REMATCH[1]}"
          upstream_tag="v${upstream_version}"
          release="$(gh api "repos/earendil-works/pi/releases/tags/${upstream_tag}")"
          jq -e --arg tag "${upstream_tag}" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "${release}" >/dev/null
          published_at="$(jq -er '.published_at | select(type == "string")' <<< "${release}")"
          if [[ ! "${published_at}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$ ]]; then
            echo "::error::Upstream release published_at is not canonical UTC RFC3339: ${published_at}"
            exit 1
          fi
          if ! published_at_round_trip="$(date --utc --date="${published_at}" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null)" ||
            [[ "${published_at_round_trip}" != "${published_at}" ]]; then
            echo "::error::Upstream release published_at is not a valid calendar timestamp: ${published_at}"
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          git fetch --no-tags https://github.com/earendil-works/pi.git \
            "+refs/tags/${upstream_tag}:refs/pion-upstream-release"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          dev_commit="$(git rev-parse refs/remotes/origin/dev)"
          upstream_commit="$(git rev-list -n 1 refs/pion-upstream-release)"
          test "${tag_commit}" = "${head_commit}"
          git merge-base --is-ancestor "${upstream_commit}" "${tag_commit}"
          git merge-base --is-ancestor "${tag_commit}" "${dev_commit}"
          node scripts/create-pion-release.mjs --validate-source --version "${pion_version}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon for tests
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: ./test.sh

      - name: Create Pion artifact
        run: |
          set -euo pipefail
          pion_version="${RELEASE_TAG#pion-v}"
          upstream_version="${pion_version%%-pion.*}"
          node scripts/create-pion-release.mjs \
            --version "${pion_version}" \
            --upstream-tag "v${upstream_version}" \
            --upstream-ref refs/pion-upstream-release \
            --source-commit "$(git rev-parse HEAD)" \
            --out release-assets

      - name: Smoke-test isolated install
        run: |
          set -euo pipefail
          pion_version="${RELEASE_TAG#pion-v}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT
          cd "${smoke_root}"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=dev --no-audit --no-fund \
            "${GITHUB_WORKSPACE}/release-assets/pablontiv-pion-${pion_version}.tgz"
          test "$(node_modules/.bin/pion --version)" = "${pion_version}"
          node_modules/.bin/pion --help >/dev/null

      - name: Upload Pion release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pion-release-${{ env.RELEASE_TAG }}
          path: release-assets/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    if: ${{ github.repository == 'pablontiv/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Download Pion release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pion-release-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate Pion release payload
        run: |
          set -euo pipefail
          pion_version="${RELEASE_TAG#pion-v}"
          upstream_version="${pion_version%%-pion.*}"
          node scripts/create-pion-release.mjs \
            --validate-assets \
            --version "${pion_version}" \
            --upstream-tag "v${upstream_version}" \
            --source-commit "$(git rev-parse HEAD)" \
            --out release-assets

      - name: Create draft GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          version="${RELEASE_TAG#pion-v}"
          artifact="pablontiv-pion-${version}.tgz"
          release_assets=("${artifact}" PION_RELEASE.json SHA256SUMS RELEASE_NOTES.md)

          lookup_error="$(mktemp)"
          trap 'rm -f "${lookup_error}"' EXIT
          if existing_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>"${lookup_error}")"; then
            existing_id="$(jq -r '.id' <<< "${existing_release}")"
            echo "::error::GitHub Release ${RELEASE_TAG} already exists as release ID ${existing_id}; refusing to mutate it."
            exit 1
          fi
          if ! grep -q 'HTTP 404' "${lookup_error}"; then
            cat "${lookup_error}" >&2
            echo "::error::Could not safely establish that GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$(git rev-parse HEAD)"

          cleanup_failed_draft() {
            failure_status=$?
            trap - ERR
            set +e
            echo "::warning::Draft staging failed; attempting cleanup of captured release ID ${release_id}."
            cleanup_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            if jq -e --argjson id "${release_id}" --arg tag "${RELEASE_TAG}" \
              '.id == $id and .tag_name == $tag and .draft == true' \
              <<< "${cleanup_release}" >/dev/null; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null
            else
              echo "::error::Captured release ID no longer identifies this run's draft; refusing trap cleanup."
            fi
            exit "${failure_status}"
          }

          created_release="$(
            jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg title "Pion v${version}" \
              --rawfile body RELEASE_NOTES.md \
              '{tag_name: $tag, name: $title, body: $body, draft: true, prerelease: false}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input -
          )"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' <<< "${created_release}")"
          trap cleanup_failed_draft ERR

          upload_url="$(jq -er '.upload_url | select(type == "string")' <<< "${created_release}")"
          expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets{?name,label}"
          if [[ "${upload_url}" != "${expected_upload_url}" ]]; then
            echo "::error::Draft release returned an unexpected asset upload URL; refusing to upload."
          fi
          test "${upload_url}" = "${expected_upload_url}"
          asset_upload_url="${upload_url%\{\?name,label\}}"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

          jq -e --argjson id "${release_id}" --arg tag "${RELEASE_TAG}" \
            '.id == $id and .tag_name == $tag and .draft == true and .prerelease == false and (.assets | length == 0)' \
            <<< "${created_release}" >/dev/null
          for asset in "${release_assets[@]}"; do
            encoded_asset_name="$(jq -rn --arg name "${asset}" '$name | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${asset}" \
              "${asset_upload_url}?name=${encoded_asset_name}" >/dev/null
          done

          staged_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e --argjson id "${release_id}" --arg tag "${RELEASE_TAG}" \
            '.id == $id and .tag_name == $tag and .draft == true and .prerelease == false' \
            <<< "${staged_release}" >/dev/null
          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(jq -r '.assets | map(.name) | sort | .[]' <<< "${staged_release}")"
          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not exactly match the four expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            false
          fi
          trap - ERR

  publish-github-release:
    if: ${{ github.repository == 'pablontiv/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_ID: ${{ needs.stage-github-release.outputs.release_id }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No valid release ID was captured from draft creation; refusing to publish by tag."
            exit 1
          fi
          version="${RELEASE_TAG#pion-v}"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --argjson id "${RELEASE_ID}" --arg tag "${RELEASE_TAG}" \
            '.id == $id and .tag_name == $tag and .draft == true and .prerelease == false' \
            <<< "${release}" >/dev/null
          expected="$(printf '%s\n' PION_RELEASE.json RELEASE_NOTES.md SHA256SUMS "pablontiv-pion-${version}.tgz")"
          actual="$(jq -r '.assets | map(.name) | sort | .[]' <<< "${release}")"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Draft GitHub Release asset set does not exactly match the four expected files."
            exit 1
          fi
          published="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=false)"
          jq -e --argjson id "${RELEASE_ID}" --arg tag "${RELEASE_TAG}" \
            '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "${published}" >/dev/null

  cleanup-draft-github-release:
    if: ${{ github.repository == 'pablontiv/pi' && always() && needs.stage-github-release.result != 'skipped' && needs.publish-github-release.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - stage-github-release
      - publish-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_ID: ${{ needs.stage-github-release.outputs.release_id }}
    steps:
      - name: Delete only the draft created by this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No valid release ID was captured; leaving any existing draft untouched."
            exit 1
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if ! jq -e --argjson id "${RELEASE_ID}" --arg tag "${RELEASE_TAG}" \
            '.id == $id and .tag_name == $tag and .draft == true' <<< "${release}" >/dev/null; then
            echo "::error::Captured release ID no longer identifies this run's draft; refusing cleanup."
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
