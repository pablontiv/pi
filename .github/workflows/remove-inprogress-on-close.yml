name: Remove In Progress Label On Close

on:
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: remove-inprogress-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  remove-label:
    if: ${{ github.repository == 'earendil-works/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: Remove inprogress label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labelName = 'inprogress';
            const labels = context.payload.issue.labels ?? [];
            const hasLabel = labels.some((label) => label.name === labelName);

            if (!hasLabel) {
              console.log(`Issue does not have ${labelName} label`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: labelName,
            });
