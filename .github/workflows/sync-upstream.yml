name: Sync Upstream

on:
  schedule:
    - cron: "17 1,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-main:
    if: ${{ github.repository == 'pablontiv/pi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      main_sha: ${{ steps.sync.outputs.main_sha }}
    steps:
      - name: Checkout fork product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward fork main from upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags https://github.com/earendil-works/pi.git \
            +refs/heads/main:refs/remotes/upstream/main

          fork_main="$(git rev-parse refs/remotes/origin/main)"
          upstream_main="$(git rev-parse refs/remotes/upstream/main)"
          echo "main_sha=${upstream_main}" >> "${GITHUB_OUTPUT}"
          if [[ "${fork_main}" == "${upstream_main}" ]]; then
            echo "Fork main is already current at ${fork_main}."
          elif git merge-base --is-ancestor "${fork_main}" "${upstream_main}"; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "${upstream_main}:refs/heads/main"
          else
            echo "::error::Fork main diverged from upstream; refusing a non-fast-forward update."
            exit 1
          fi

  sync-dev:
    if: ${{ github.repository == 'pablontiv/pi' }}
    needs: sync-main
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      checks: read
      contents: write
    steps:
      - name: Checkout Pion product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Classify merge candidate
        id: candidate
        env:
          SYNCED_MAIN_SHA: ${{ needs.sync-main.outputs.main_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev

          main_sha="$(git rev-parse refs/remotes/origin/main)"
          dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [[ "${main_sha}" != "${SYNCED_MAIN_SHA}" ]]; then
            echo "::error::main changed after upstream sync; retry on the next run."
            exit 1
          fi
          node scripts/classify-upstream-merge.mjs "${dev_sha}" "${main_sha}"

      - name: Publish merge candidate
        id: publish-candidate
        if: ${{ steps.candidate.outputs.candidate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate_branch="local/upstream-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${CANDIDATE_SHA}:refs/heads/${candidate_branch}"
          echo "candidate_branch=${candidate_branch}" >> "${GITHUB_OUTPUT}"

      - name: Run CI on merge candidate
        if: ${{ steps.candidate.outputs.candidate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.publish-candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${CANDIDATE_BRANCH}"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
                --branch "${CANDIDATE_BRANCH}" --event workflow_dispatch --limit 20 \
                --json databaseId,headSha \
              | jq -r --arg sha "${CANDIDATE_SHA}" \
                '.[] | select(.headSha == $sha) | .databaseId' \
              | head -n 1
            )"
            [[ -z "${run_id}" ]] || break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::Timed out waiting for candidate CI to start."
            exit 1
          fi

          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?filter=latest&per_page=100")"
          for name in build-check-test mcp-conformance; do
            jq -e --arg name "${name}" \
              'any(.check_runs[]; .name == $name and .status == "completed" and .conclusion == "success" and .app.id == 15368)' \
              <<< "${checks}" > /dev/null
          done

      - name: Promote tested candidate to dev
        if: ${{ steps.candidate.outputs.candidate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_DEV_SHA: ${{ steps.candidate.outputs.dev_sha }}
          SYNCED_MAIN_SHA: ${{ steps.candidate.outputs.main_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev

          [[ "$(git rev-parse refs/remotes/origin/dev)" == "${ORIGINAL_DEV_SHA}" ]]
          [[ "$(git rev-parse "${CANDIDATE_SHA}^1")" == "${ORIGINAL_DEV_SHA}" ]]
          [[ "$(git rev-parse "${CANDIDATE_SHA}^2")" == "${SYNCED_MAIN_SHA}" ]]
          git merge-base --is-ancestor "${ORIGINAL_DEV_SHA}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${SYNCED_MAIN_SHA}" "${CANDIDATE_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${CANDIDATE_SHA}:refs/heads/dev"
          {
            echo "## Pion updated from upstream"
            echo
            echo "- main: ${SYNCED_MAIN_SHA}"
            echo "- previous dev: ${ORIGINAL_DEV_SHA}"
            echo "- new dev: ${CANDIDATE_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove merge candidate branch
        if: ${{ always() && steps.candidate.outputs.candidate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.publish-candidate.outputs.candidate_branch }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete "refs/heads/${CANDIDATE_BRANCH}"

  prepare-pion-tag:
    if: ${{ github.repository == 'pablontiv/pi' }}
    needs: sync-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      dev_sha: ${{ steps.prepare.outputs.dev_sha }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      version: ${{ steps.prepare.outputs.version }}
      pion_tag: ${{ steps.prepare.outputs.pion_tag }}
      source_validated: ${{ steps.prepare.outputs.source_validated }}
      release_eligible: ${{ steps.prepare.outputs.release_eligible }}
      publish_required: ${{ steps.prepare.outputs.publish_required }}
    steps:
      - name: Checkout current Pion dev source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Prepare Pion tag publication
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/earendil-works/pi/releases/latest)"
          jq -e '.draft == false and .prerelease == false' <<< "${release}" >/dev/null
          published_at="$(jq -er '.published_at | select(type == "string")' <<< "${release}")"
          if [[ ! "${published_at}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$ ]]; then
            echo "::error::Latest upstream release published_at is not canonical UTC RFC3339: ${published_at}"
            exit 1
          fi
          if ! published_at_round_trip="$(date --utc --date="${published_at}" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null)" ||
            [[ "${published_at_round_trip}" != "${published_at}" ]]; then
            echo "::error::Latest upstream release published_at is not a valid calendar timestamp: ${published_at}"
            exit 1
          fi
          upstream_tag="$(jq -er '.tag_name' <<< "${release}")"
          if [[ ! "${upstream_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Latest upstream release has a noncanonical tag: ${upstream_tag}"
            exit 1
          fi
          version="${upstream_tag#v}"
          pion_tag="pion-${upstream_tag}"

          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          dev_commit="$(git rev-parse refs/remotes/origin/dev)"
          git checkout --detach "${dev_commit}"
          git fetch --no-tags https://github.com/earendil-works/pi.git \
            "+refs/tags/${upstream_tag}:refs/pion-upstream-release"
          upstream_commit="$(git rev-list -n 1 refs/pion-upstream-release)"
          if ! git merge-base --is-ancestor "${upstream_commit}" "${dev_commit}"; then
            echo "::error::dev does not yet contain upstream ${upstream_tag}."
            exit 1
          fi
          node scripts/create-pion-release.mjs --validate-source --version "${version}"

          publish_required=true
          if git ls-remote --exit-code --refs origin "refs/tags/${pion_tag}" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/tags/${pion_tag}:refs/pion-existing-release"
            existing_commit="$(git rev-list -n 1 refs/pion-existing-release)"
            git merge-base --is-ancestor "${upstream_commit}" "${existing_commit}"
            git merge-base --is-ancestor "${existing_commit}" "${dev_commit}"
            publish_required=false
            echo "Existing ${pion_tag} is a valid recoverable release tag."
          fi

          {
            echo "dev_sha=${dev_commit}"
            echo "upstream_sha=${upstream_commit}"
            echo "upstream_tag=${upstream_tag}"
            echo "version=${version}"
            echo "pion_tag=${pion_tag}"
            echo "source_validated=true"
            echo "release_eligible=true"
            echo "publish_required=${publish_required}"
          } >> "${GITHUB_OUTPUT}"

  publish-pion-tag:
    if: ${{ github.repository == 'pablontiv/pi' && needs.prepare-pion-tag.outputs.publish_required == 'true' }}
    needs: prepare-pion-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare trusted tag publication state
        env:
          DEV_SHA: ${{ needs.prepare-pion-tag.outputs.dev_sha }}
          UPSTREAM_SHA: ${{ needs.prepare-pion-tag.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.prepare-pion-tag.outputs.upstream_tag }}
          VERSION: ${{ needs.prepare-pion-tag.outputs.version }}
          PION_TAG: ${{ needs.prepare-pion-tag.outputs.pion_tag }}
          SOURCE_VALIDATED: ${{ needs.prepare-pion-tag.outputs.source_validated }}
          RELEASE_ELIGIBLE: ${{ needs.prepare-pion-tag.outputs.release_eligible }}
          PUBLISH_REQUIRED: ${{ needs.prepare-pion-tag.outputs.publish_required }}
        run: |
          set -euo pipefail
          [[ "${DEV_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${UPSTREAM_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${UPSTREAM_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${VERSION}" == "${UPSTREAM_TAG#v}" ]]
          [[ "${PION_TAG}" == "pion-${UPSTREAM_TAG}" ]]
          [[ "${SOURCE_VALIDATED}" == "true" ]]
          [[ "${RELEASE_ELIGIBLE}" == "true" ]]
          [[ "${PUBLISH_REQUIRED}" == "true" ]]

          publish_root="${RUNNER_TEMP}/pion-tag-publish"
          known_hosts="${RUNNER_TEMP}/pion-sync-known-hosts"
          rm -rf "${publish_root}"
          git init --quiet "${publish_root}"
          git -C "${publish_root}" remote add origin https://github.com/pablontiv/pi.git
          git -C "${publish_root}" fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          [[ "$(git -C "${publish_root}" rev-parse refs/remotes/origin/dev)" == "${DEV_SHA}" ]]
          git -C "${publish_root}" fetch --no-tags https://github.com/earendil-works/pi.git \
            "+refs/tags/${UPSTREAM_TAG}:refs/pion-upstream-release"
          [[ "$(git -C "${publish_root}" rev-list -n 1 refs/pion-upstream-release)" == "${UPSTREAM_SHA}" ]]
          git -C "${publish_root}" merge-base --is-ancestor "${UPSTREAM_SHA}" "${DEV_SHA}"
          set +e
          git -C "${publish_root}" ls-remote --exit-code --refs origin "refs/tags/${PION_TAG}" >/dev/null 2>&1
          tag_status=$?
          set -e
          [[ "${tag_status}" == "2" ]]
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://api.github.com/meta \
            | jq -er '.ssh_keys[] | "github.com " + .' > "${known_hosts}"
          [[ -s "${known_hosts}" ]]

      - name: Publish exact Pion tag
        env:
          DEV_SHA: ${{ needs.prepare-pion-tag.outputs.dev_sha }}
          PION_TAG: ${{ needs.prepare-pion-tag.outputs.pion_tag }}
          PION_SYNC_DEPLOY_KEY: ${{ secrets.PION_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/pion-sync-deploy-key"
          known_hosts="${RUNNER_TEMP}/pion-sync-known-hosts"
          trap 'rm -f "${key_path}"' EXIT
          test -n "${PION_SYNC_DEPLOY_KEY}"
          printf '%s\n' "${PION_SYNC_DEPLOY_KEY}" > "${key_path}"
          chmod 0600 "${key_path}"
          GIT_SSH_COMMAND="ssh -i ${key_path} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts}" \
            git -c core.hooksPath=/dev/null -C "${RUNNER_TEMP}/pion-tag-publish" push "git@github.com:pablontiv/pi.git" \
              "${DEV_SHA}:refs/tags/${PION_TAG}"
